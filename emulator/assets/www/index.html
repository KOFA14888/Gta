<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GTA VI — Emulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- ══════════ ГЛАВНЫЙ ЭКРАН ══════════ -->
  <section id="screen-launch" class="screen active">
    <div class="launch-bg"></div>
    <div class="launch-tint"></div>

    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 18" width="28" height="21" aria-hidden="true">
          <rect x="1.2" y="3.2" width="21.6" height="12" rx="6" fill="none" stroke="#fff" stroke-width="1.7"/>
          <path d="M7 7.2v4.4M4.8 9.4h4.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="15" cy="7.9" r="1" fill="#fff"/><circle cx="17.6" cy="10.5" r="1" fill="#fff"/>
        </svg>
        <span class="brand-text">EMULATOR</span>
      </div>
      <div class="topbar-right">
        <svg viewBox="0 0 30 16" width="27" height="15" aria-hidden="true"><rect x="1" y="2.5" width="23" height="11" rx="3" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="3.8" y="5.3" width="12" height="5.4" rx="1.4" fill="#fff"/><rect x="26" y="6" width="3" height="4" rx="1" fill="#fff"/></svg>
        <span id="psClock" class="clock">22:30</span>
        <div class="avatar">VC</div>
      </div>
    </header>

    <div class="game-row single">
      <button class="tile tile-art selected tile-big" id="tileGtaVI" aria-label="Grand Theft Auto VI — играть">
        <img src="img/vi_logo.jpg" alt="Grand Theft Auto VI" draggable="false">
        <span class="tile-shine"></span>
      </button>
    </div>

    <div class="launch-info">
      <h1 class="li-title">Grand Theft Auto <em>VI</em></h1>
      <div class="li-edition">Digital Deluxe Edition</div>
      <button id="playBtn" class="play-pill" aria-label="Играть">
        <span class="x-dot"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 6.5v11l9-5.5z" fill="#fff"/></svg></span>
        <span class="play-pill-text" id="playLabel">Играть</span>
      </button>
    </div>
  </section>

  <!-- ══════════ ЗАГРУЗКА ══════════ -->
  <section id="screen-boot" class="screen">
    <img class="boot-logo" src="img/vi_logo.jpg" alt="Grand Theft Auto VI" draggable="false">
    <div class="boot-bar"><div id="bootFill" class="boot-fill"></div></div>
  </section>

  <!-- ══════════ ИГРА ══════════ -->
  <section id="screen-game" class="screen">
    <video id="gameVideo" src="../video/gameplay.mp4" preload="auto" playsinline webkit-playsinline></video>
    <div id="videoFallback" class="video-fallback hidden">
      <div class="vf-circle"><svg viewBox="0 0 24 24" width="42" height="42"><path d="M8 5v14l12-7z" fill="#fff"/></svg></div>
      <div class="vf-text">Нажмите, чтобы продолжить</div>
    </div>

    <button id="pauseBtn" class="pause-mini" aria-label="Пауза">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5h2.6v14H8zM13.4 5H16v14h-2.6z" fill="#fff"/></svg>
    </button>

    <!-- ═══ ВИРТУАЛЬНЫЙ ГЕЙМПАД (эмулятор-оверлей) ═══ -->
    <div id="pad" class="pad">
      <!-- LT / LB -->
      <button class="xp xp-trigger lt" data-btn="LT"><span>LT</span></button>
      <button class="xp xp-trigger lb" data-btn="LB"><span>LB</span></button>
      <!-- D-pad -->
      <svg class="dpad" viewBox="0 0 132 150" aria-hidden="true">
        <g class="dpad-art">
          <rect x="44" y="4" width="44" height="142" rx="12"/>
          <rect x="0" y="53" width="132" height="44" rx="12"/>
          <circle cx="66" cy="75" r="15"/>
        </g>
        <g class="xp-d dhit" data-btn="DUP"><rect x="38" y="0" width="56" height="62" rx="10"/></g>
        <g class="xp-d dhit" data-btn="DDOWN"><rect x="38" y="88" width="56" height="62" rx="10"/></g>
        <g class="xp-d dhit" data-btn="DLEFT"><rect x="0" y="46" width="52" height="58" rx="10"/></g>
        <g class="xp-d dhit" data-btn="DRIGHT"><rect x="80" y="46" width="52" height="58" rx="10"/></g>
      </svg>

      <!-- RT / RB -->
      <button class="xp xp-trigger rt" data-btn="RT"><span>RT</span></button>
      <button class="xp xp-trigger rb" data-btn="RB"><span>RB</span></button>

      <!-- большой сквар (скриншот) -->
      <button class="xp xp-square" data-btn="SQUARE" aria-label="Скриншот"></button>

      <!-- левый стик -->
      <button class="xp stick" data-btn="LSTICK" aria-label="Стик"><span class="stick-cap"></span></button>
      <button class="xp circle small l3" data-btn="L3"><span>L3</span></button>

      <!-- view / menu -->
      <button class="xp pill view" data-btn="VIEW" aria-label="Сначала">
        <svg viewBox="0 0 24 20" width="20" height="17"><rect x="2" y="2.5" width="9" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="8" y="7" width="14" height="10.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
      <button class="xp pill menu" data-btn="MENU" aria-label="Меню">
        <svg viewBox="0 0 24 18" width="21" height="15"><path d="M3 3h18M3 9h18M3 15h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <!-- ABXY -->
      <button class="xp circle face y" data-btn="Y"><span>Y</span></button>
      <button class="xp circle face x" data-btn="X"><span>X</span></button>
      <button class="xp circle face b" data-btn="B"><span>B</span></button>
      <button class="xp circle face a" data-btn="A"><span>A</span></button>
      <button class="xp circle small r3" data-btn="R3"><span>R3</span></button>

      <!-- perf-монитор -->
      <div class="perf" aria-hidden="true">
        <div class="perf-line"><span class="pf-gpu">GPU</span><b id="pfGpu">0%</b></div>
        <div class="perf-line"><span class="pf-cpu">CPU</span><b id="pfCpu">30%</b></div>
        <div class="perf-line"><span class="pf-ram">RAM</span><b id="pfRam">97%</b></div>
        <div class="perf-line"><span class="pf-pwr">Power</span><b id="pfPwr">2.5w</b></div>
        <div class="perf-line"><span class="pf-dxvk">DXVK</span><b id="pfFps">58fps</b></div>
        <canvas id="pfGraph" width="116" height="20"></canvas>
      </div>
    </div>

    <!-- пауза -->
    <div id="pauseMenu" class="overlay hidden">
      <div class="overlay-card">
        <div class="oc-art"><img src="img/bg_keyart.jpg" alt=""></div>
        <div class="oc-title">Grand Theft Auto <em>VI</em></div>
        <button id="pmResume" class="oc-btn primary"><b>▶</b> Продолжить</button>
        <button id="pmExit" class="oc-btn"><b>✕</b> В главное меню</button>
      </div>
    </div>

    <!-- конец демо -->
    <div id="gameEnd" class="overlay hidden">
      <div class="overlay-card slim">
        <img class="oc-logo" src="img/vi_logo.jpg" alt="Grand Theft Auto VI">
        <div class="oc-thanks">Спасибо за игру</div>
        <button id="geMenuBtn" class="oc-btn primary">В главное меню</button>
      </div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
